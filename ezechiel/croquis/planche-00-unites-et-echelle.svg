<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1131" width="420mm" height="297mm"><style>
:root{--paper:#ffffff;--sheet:#ffffff;--ink:#1b2833;--line:#34506a;--muted:#5b6c79;--fill:#c3d2dc;--soft:#e4ecf1;--soft2:#d3e0e9;
--cote:#b0392b;--hyp:#8c6a12;--water:#9cc3dc;--rule:#cdd8df;
--f-disp:"Barlow Condensed","Bahnschrift SemiCondensed","Bahnschrift","Arial Narrow",sans-serif;
--f-body:"Source Serif 4",Georgia,serif;--f-mono:"IBM Plex Mono",Consolas,ui-monospace,monospace}
.dr *{vector-effect:non-scaling-stroke}
.wall{fill:var(--fill);stroke:var(--line);stroke-width:1.4}
.wallh{fill:none;stroke:var(--hyp);stroke-width:1.2;stroke-dasharray:6 4}
.soft{fill:var(--soft);stroke:var(--line);stroke-width:.8}
.soft2{fill:var(--soft2);stroke:var(--line);stroke-width:.8}
.bg{fill:var(--sheet);stroke:var(--line);stroke-width:1}
.ln{fill:none;stroke:var(--line);stroke-width:1.4}
.thin{fill:none;stroke:var(--line);stroke-width:.8}
.dash{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:7 5}
.hyp{fill:none;stroke:var(--hyp);stroke-width:1.4;stroke-dasharray:6 4}
.bar{fill:var(--cote);stroke:none;opacity:.55}
.water{fill:var(--water);stroke:var(--line);stroke-width:1}
.dim{stroke:var(--cote);stroke-width:1;fill:none}
.ext{stroke:var(--cote);stroke-width:.6;fill:none;opacity:.7}
.tx{fill:var(--ink);font-family:var(--f-mono)}
.lbl{fill:var(--ink);font-family:var(--f-disp);font-weight:600;letter-spacing:.02em}
.mut{fill:var(--muted);font-family:var(--f-mono)}
.tc{fill:var(--cote);font-family:var(--f-mono);font-weight:500}
.th{fill:var(--hyp);font-family:var(--f-mono)}
.solid{fill:var(--line);stroke:none}
.frame{fill:none;stroke:var(--ink);stroke-width:2.2}
.frame2{fill:none;stroke:var(--ink);stroke-width:.8}
.cell{fill:none;stroke:var(--ink);stroke-width:.8}
.k-num{font-family:var(--f-mono);font-size:15px;fill:var(--cote);letter-spacing:2px}
.k-title{font-family:var(--f-disp);font-weight:600;font-size:46px;fill:var(--ink)}
.k-ref{font-family:var(--f-mono);font-size:15px;fill:var(--muted)}
.k-lab{font-family:var(--f-mono);font-size:12px;fill:var(--muted);letter-spacing:1.5px}
.k-txt{font-family:var(--f-mono);font-size:15px;fill:var(--ink)}
.k-small{font-family:var(--f-mono);font-size:13px;fill:var(--ink)}
.sb-a{fill:var(--ink)} .sb-b{fill:#fff;stroke:var(--ink);stroke-width:1}
</style><rect x="0" y="0" width="1600" height="1131" fill="#ffffff"/><rect x="20" y="20" width="1560" height="1091" class="frame"/><svg viewBox="-6 -14 345 92" role="img" aria-label="Unités et échelle" x="50" y="45" width="1500" height="830" preserveAspectRatio="xMidYMid meet" class="dr"><rect x="0" y="0" width="7.5" height="8" class="soft2"/><text x="12" y="4" class="tx" font-size="6.8" text-anchor="start" dominant-baseline="middle">palme (tefah) ≈ 7,5 cm · empan (zeret) = ½ coudée</text><rect x="0" y="20" width="45" height="8" class="soft"/><line x1="7.5" y1="20" x2="7.5" y2="28" class="thin"/><line x1="15" y1="20" x2="15" y2="28" class="thin"/><line x1="22.5" y1="20" x2="22.5" y2="28" class="thin"/><line x1="30" y1="20" x2="30" y2="28" class="thin"/><line x1="37.5" y1="20" x2="37.5" y2="28" class="thin"/><text x="52" y="24" class="tx" font-size="6.8" text-anchor="start" dominant-baseline="middle">coudée ordinaire = 6 palmes ≈ 45 cm</text><rect x="0" y="38" width="52.5" height="8" class="soft2"/><line x1="7.5" y1="38" x2="7.5" y2="46" class="thin"/><line x1="15" y1="38" x2="15" y2="46" class="thin"/><line x1="22.5" y1="38" x2="22.5" y2="46" class="thin"/><line x1="30" y1="38" x2="30" y2="46" class="thin"/><line x1="37.5" y1="38" x2="37.5" y2="46" class="thin"/><line x1="45" y1="38" x2="45" y2="46" class="thin"/><text x="60" y="42" class="tx" font-size="6.8" text-anchor="start" dominant-baseline="middle">coudée longue = coudée + 1 palme = 7 palmes ≈ 52,5 cm</text><rect x="0" y="60" width="315" height="8" class="wall"/><line x1="52.5" y1="60" x2="52.5" y2="68" class="ln"/><line x1="105" y1="60" x2="105" y2="68" class="ln"/><line x1="157.5" y1="60" x2="157.5" y2="68" class="ln"/><line x1="210" y1="60" x2="210" y2="68" class="ln"/><line x1="262.5" y1="60" x2="262.5" y2="68" class="ln"/><line x1="0" y1="58.8" x2="0" y2="52.2" class="ext"/><line x1="315" y1="58.8" x2="315" y2="52.2" class="ext"/><line x1="0" y1="55" x2="315" y2="55" class="dim"/><line x1="-2.56" y1="52.44" x2="2.56" y2="57.56" class="dim"/><line x1="312.44" y1="52.44" x2="317.56" y2="57.56" class="dim"/><text x="157.5" y="50.04" class="tc" font-size="7.2" text-anchor="middle" dominant-baseline="middle" transform="rotate(0 157.5 50.04)">roseau (qaneh) = 6 coudées longues ≈ 3,15 m</text><text x="0" y="76" class="mut" font-size="6" text-anchor="start" dominant-baseline="middle">cordeau de lin : mesures longues du fleuve (47:3)</text></svg><line x1="20" y1="900" x2="1580" y2="900" class="frame"/><line x1="800" y1="900" x2="800" y2="1111" class="cell"/><line x1="1190" y1="900" x2="1190" y2="1111" class="cell"/><text x="44" y="934" class="k-num">PLANCHE 00 · TEMPLE D'ÉZÉCHIEL</text><text x="44" y="992" class="k-title">Unités et échelle</text><text x="44" y="1030" class="k-ref">Ézéchiel 40:3-5 · 43:13 · 45:10-12</text><text x="44" y="1075" class="k-lab">CROQUIS POUR MODÉLISATION BLENDER · v1 · 24/11/2026</text><text x="822" y="930" class="k-lab">ÉCHELLE</text><rect x="822" y="970" width="43.47826086956521" height="10" class="sb-a"/><rect x="865.4782608695652" y="970" width="43.47826086956521" height="10" class="sb-b"/><rect x="908.9565217391304" y="970" width="43.47826086956521" height="10" class="sb-a"/><rect x="952.4347826086956" y="970" width="43.47826086956521" height="10" class="sb-b"/><rect x="995.9130434782609" y="970" width="43.47826086956521" height="10" class="sb-a"/><rect x="822" y="970" width="217.39130434782606" height="10" fill="none" stroke="#1b2833" stroke-width="1"/><text x="822" y="962" class="k-small">0</text><text x="1039.391304347826" y="962" class="k-small" text-anchor="end">50 cm</text><text x="822" y="1002" class="k-small">50 cm 0,95 coudée</text><text x="822" y="1066" class="k-small">1 coudée longue = 52,5 cm</text><text x="822" y="1086" class="k-small">1 roseau = 6 coudées = 3,15 m</text><text x="1212" y="930" class="k-lab">LÉGENDE</text><rect x="1212" y="952" width="36" height="16" class="wall"/><text x="1260" y="965" class="k-small">maçonnerie cotée par le texte</text><rect x="1212" y="982" width="36" height="16" class="wallh"/><text x="1260" y="995" class="k-small">hypothèse ou déduction</text><rect x="1212" y="1012" width="36" height="16" class="soft"/><text x="1260" y="1025" class="k-small">sol, cour, terrain</text><line x1="1212" y1="1050" x2="1248" y2="1050" class="dim" stroke-width="2"/><text x="1260" y="1055" class="k-small">cote en coudées longues</text><text x="1212" y="1085" class="k-small" fill="#5b6c79">Plans : nord en haut, est à droite (sauf mention)</text></svg>