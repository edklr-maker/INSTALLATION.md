.dr *{vector-effect:non-scaling-stroke}
.wall{fill:var(--fill);stroke:var(--line);stroke-width:1.4}
.wallh{fill:none;stroke:var(--hyp);stroke-width:1.2;stroke-dasharray:6 4}
