wall"/><text x="1260" y="965" class="k-small">maçonnerie cotée par le texte</text><rect x="1212" y="982" width="36" height="16" class="wallh"/><text x="1260" y="995" class="k-small">hypothèse ou déduction</text><rect x="1212" y="1012" width="36" height="16" class="soft"/><text x="1260" y="1025" class="k-small">sol, cour, terrain</text><line x1="1212" y1="1050" x2="1248" y2="1050" class="dim" stroke-width="2"/><text x="1260" y="1055" class="k-small">cote en coudées longues</text><text x="1212" y="1085" class="k-small" fill="#5b6c79">Plans : nord en haut, est à droite (sauf mention)</text></svg>